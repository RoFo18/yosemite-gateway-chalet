# The local businesses we send guests to. Rendered on /local-favorites/ and published as
# /shoutouts.json, a plain feed that social-media tools and bots can read to write posts.
# Only verified links. Keep every post under 240 characters, no em dashes.
locals:
  - id: la-parrilla
    name: La Parrilla
    kind: Restaurant
    what: The best Mexican food in the Eastern Sierra, across the courtyard from June Lake Brewing.
    address: June Lake village, across the courtyard from June Lake Brewing
    instagram: https://www.instagram.com/laparrilla_158/
    handle: "@laparrilla_158"
    img: la-parrilla-yeti
    img_alt: "A yeti in a white shaggy costume ordering at La Parrilla's taco truck window on a sunny winter day, snow on the ground and the peaks behind"
    cap: Yes, that is a yeti. No, he did not wait his turn.
    guide: "Folks drive four hundred miles looking for Bigfoot in the Sierra. Turns out he lives in June Lake, he orders the carne asada, and he tips better than most fishing guides."
    used_on: [/experiences/dining/]
    posts:
      - "Best Mexican food in the Eastern Sierra, and we will not be talked out of it: La Parrilla, across the courtyard from June Lake Brewing. @laparrilla_158"
      - "Ski day, fishing day, any day: end it with tacos from La Parrilla and a pint across the courtyard at June Lake Brewing. @laparrilla_158"
      - "Skunked on the June Lake Loop? Happens to the best of us. The cure is La Parrilla, the best Mexican food in the Eastern Sierra, across the courtyard from June Lake Brewing. @laparrilla_158"
  - id: ernies
    name: Ernie's Tackle and Ski Shop
    kind: SportingGoodsStore
    what: Ski and snowboard rentals, tunes, fishing tackle, licenses and the best local report in June Lake. Jeremy runs the shop, and he is the one to ask.
    address: 2604 Boulder Dr., June Lake, CA 93529
    phone: (760) 648-7756
    url: https://www.erniestackleandskishop.com/
    instagram: https://www.instagram.com/erniestacklejl/
    facebook: https://www.facebook.com/Erniestackleandski/
    handle: "@erniestacklejl"
    guide: "If Jeremy says the fish are on the Upper Owens, go to the Upper Owens. If Jeremy says they are not biting anywhere, go anyway, and buy a few more flies on the way out."
    used_on: [/experiences/winter/, /fly-fishing/, /fly-fishing/june-lake-loop/]
    posts:
      - "Skiing June Mountain this week? Get your rentals and a tune at Ernie's Tackle and Ski Shop in June Lake village. Same crew sets you up on a fly rod all summer. @erniestacklejl"
      - "Before you fish the June Lake Loop, stop at Ernie's. Flies, licenses and the only fishing report that matters. @erniestacklejl"
      - "Forgot your gloves, your wax, or your waders? Ernie's in June Lake has it, and a good story to go with it. @erniestacklejl"
  - id: tiger-bar
    name: The Tiger Bar
    kind: BarOrPub
    what: June Lake's historic bar and grill, under new management from the same owners as La Parrilla.
    address: June Lake village
    instagram: https://www.instagram.com/tigerbar_junelake/
    handle: "@tigerbar_junelake"
    guide: "One of the oldest liquor licenses in California. The stories in that room are older than the license, and about half of them are true."
    used_on: [/experiences/dining/]
    posts:
      - "The Tiger Bar in June Lake has new owners, the same crew behind La Parrilla, and the food has never been better. One of the oldest liquor licenses in California, and still the best room in town."
      - "Après in June Lake means the Tiger Bar. New management, great food, the same old bar. Go. @tigerbar_junelake"
      - "Best breakfast on the June Lake Loop? Silver Lake Resort has held the title for years. The Tiger Bar, under new management, is making it a tie. @tigerbar_junelake"
  - id: general-store
    name: June Lake General Store
    kind: GroceryStore
    what: Groceries, firewood, hardware, camping supplies and whatever you forgot to pack, in June Lake village. Luis, the owner, is a solid family man and a great guy, and the store is one of the cornerstones of the June Lake community. We are lucky to have him.
    address: June Lake village
    img: june-lake-general-store
    img_alt: "The June Lake General Store: a steep A-frame gable with a pine wreath and icicle lights, white double doors, and two carved bears holding trout on Welcome stumps, with pumpkins out front"
    cap: Two carved bears holding trout. That is how you know you are in the right place.
    guide: "In the off season, check the hours before you count on it first thing in the morning. Most days it is open right when you need it, which is more than you can say for the road."
    used_on: [/guides/june-lake/]
    posts:
      - "Staying on the June Lake Loop? The June Lake General Store has your groceries, your firewood and the thing you forgot to pack."
      - "Luis and his family run the June Lake General Store, and the whole town is better for it. Off season, check the hours before you go in the morning."
  - id: sierra-moments
    name: Sierra Moments Fishing Adventures
    kind: TravelAgency
    what: Family-friendly fishing and fly-fishing guide service in June Lake, run by Scott "Knot," with 50+ years on Eastern Sierra water.
    phone: (760) 577-1247
    url: https://www.sierramoments.com/
    facebook: https://www.facebook.com/sierramoments
    guide: "Knot has been on this water for fifty years. The fish have been here longer, but not by much, and he knows most of them personally."
    used_on: [/fly-fishing/, /fly-fishing/upper-owens-river/, /fly-fishing/june-lake-loop/]
    posts:
      - "First trout on a fly rod? Call Knot at Sierra Moments Fishing Adventures in June Lake. Fifty years on Eastern Sierra water and very good with kids."
      - "The Upper Owens, the June Lake Loop or a backcountry lake: Knot at Sierra Moments knows where the fish are this week."
  - id: sierra-mountain-guides
    name: Sierra Mountain Guides
    kind: TravelAgency
    what: IFMGA-certified guiding, the backcountry tours at June Mountain, avalanche courses, and ice and alpine climbing. Owner and lead guide Howie Schwartz.
    url: https://sierramtnguides.com/
    instagram: https://www.instagram.com/sierramountainguides/
    facebook: https://m.facebook.com/sierramtnguides
    handle: "@sierramountainguides"
    guide: "Howie knows where the snow is good and, more important, where it is about to let go. Pay the man."
    used_on: [/experiences/winter/]
    posts:
      - "Ski from the top of June Mountain to a hot tub. With Sierra Mountain Guides and Howie Schwartz, snow allowing, you can. Avalanche training required, good times included. @sierramountainguides"
      - "June Mountain has some of the best lift-assisted backcountry in the lower 48. Do it right: go with Sierra Mountain Guides. @sierramountainguides"
      - "Want to learn the backcountry yourself? Sierra Mountain Guides runs avalanche courses all winter in the Eastern Sierra. @sierramountainguides"
  - id: frontier-pack-train
    name: Frontier Pack Train
    wide: true
    kind: TouristAttraction
    what: Horseback rides from an hour to several days, from the pack station near Silver Lake on the June Lake Loop.
    phone: (760) 648-7701
    guide: "Let the horse do the climbing. He has made the trip more times than you have, and he does not complain about the altitude."
    used_on: [/experiences/hiking/]
    posts:
      - "Horseback up Parker Bench with Mono Lake laid out below. Frontier Pack Train on the June Lake Loop, a few minutes from the chalet."
  - id: silver-lake-resort
    name: Silver Lake Resort
    section: If we are full
    kind: LodgingBusiness
    what: Classic cabins on Silver Lake and a cafe with one of the best breakfasts on the June Lake Loop. Seasonal, roughly late spring to fall.
    address: Silver Lake, June Lake Loop, Highway 158
    url: https://www.silverlakeresort.net/store-cafe/
    used_on: [/experiences/dining/, /faq/]
    posts:
      - "Breakfast at the Silver Lake Resort cafe, then a paddle on Silver Lake. That is a whole morning on the June Lake Loop, done right."
      - "Some Silver Lake Resort cabin weeks have been booked by the same families for generations. If you get one, keep it."
  - id: double-eagle
    name: Double Eagle Resort and Spa
    kind: Resort
    what: A full spa, a gym, an indoor pool, the Eagle's Landing restaurant and a kids' fishing pond, about a mile from the chalet by the Forest Service trail through the aspens.
    address: June Lake Loop, Highway 158
    url: https://doubleeagle.com/
    instagram: https://www.instagram.com/doubleeagleresort/
    handle: "@doubleeagleresort"
    guide: "Walk over through the aspens. Get the massage and take the long way home. Your legs will thank you twice."
    used_on: [/experiences/dining/, /experiences/spa-and-hot-springs/, /faq/]
    posts:
      - "Walk a mile through the aspens on the Forest Service trail and you are at the Double Eagle: massage, workout, pool, and a fishing pond for the little ones. @doubleeagleresort"
