    address: 2604 Boulder Dr., June Lake, CA 93529
    phone: (760) 648-7756
    url: https://www.erniestackleandskishop.com/
    instagram: https://www.instagram.com/erniestacklejl/
    facebook: https://www.facebook.com/Erniestackleandski/
    handle: "@erniestacklejl"
    used_on: [/experiences/winter/, /fly-fishing/, /fly-fishing/june-lake-loop/]
    posts:
      - "Skiing June Mountain this week? Get your rentals and a tune at Ernie's Tackle and Ski Shop in June Lake village. Same crew sets you up on a fly rod all summer. @erniestacklejl"
